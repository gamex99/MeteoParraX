[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Regla Técnica: USB Host Configuration ---
; ARDUINO_USB_MODE=0: Habilita modo Host nativo.
; ARDUINO_USB_CDC_ON_BOOT=0: Desactiva CDC interno para evitar conflictos con usb_host.h.
; El debug se realiza por el puerto UART estándar (TX0/RX0).
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=3

; Particiones personalizadas para OTA y LittleFS (Logs y Cola FIFO)
board_build.partitions = partitions.csv

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.2

; Configuración de subida vía USB UART (COM5)
upload_protocol = esptool
upload_port = COM5
